<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quran Search</title>
  <style>
    @font-face {
      font-family: 'KFGQPC Hafs Uthmanic';
      src: url('https://cdn.jsdelivr.net/gh/fawazahmed0/quran-api@1/fonts/hafs-uthmanic-v14-full.woff2') format('woff2'),
           url('https://cdn.jsdelivr.net/gh/fawazahmed0/quran-api@1/fonts/hafs-uthmanic-v14-full.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/fawazahmed0/quran-api@1/fonts/hafs-uthmanic-v14-full.ttf') format('truetype');
      font-display: swap;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e0e0e0;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.6rem;
      color: #d4af37;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    }

    header p {
      margin-top: 0.4rem;
      color: #9ab;
      font-size: 0.95rem;
      direction: ltr;
    }

    .search-box {
      display: flex;
      gap: 0.6rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 12px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1.4rem;
      color: #fff;
      direction: rtl;
      font-family: inherit;
    }

    .search-box input::placeholder { color: #556; }

    .search-box button {
      background: #d4af37;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1.4rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      direction: ltr;
      white-space: nowrap;
    }

    .search-box button:hover { background: #e8c84a; }
    .search-box button:active { transform: scale(0.97); }

    .stats {
      display: none;
      background: rgba(212,175,55,0.1);
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 10px;
      padding: 0.8rem 1.2rem;
      margin-bottom: 1.2rem;
      direction: ltr;
      text-align: center;
      font-size: 0.95rem;
      color: #d4af37;
    }

    .stats span { font-weight: 700; font-size: 1.1rem; }

    .results { display: flex; flex-direction: column; gap: 0.75rem; }

    .verse-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-right: 3px solid #d4af37;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      transition: background 0.2s;
    }

    .verse-card.meccan  { border-right-color: #e8873a; }
    .verse-card.medinan { border-right-color: #4caf8f; }

    .verse-card:hover { background: rgba(255,255,255,0.09); }

    .verse-ref {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.78rem;
      direction: ltr;
      margin-bottom: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .verse-ref .ref-loc  { color: #d4af37; }

    .verse-ref .surah-name {
      color: #c8c8c8;
      font-weight: 500;
    }

    .verse-ref .surah-name-ar {
      font-family: 'KFGQPC Hafs Uthmanic', serif;
      font-size: 0.9rem;
      color: #c8c8c8;
    }

    .place-badge {
      font-size: 0.65rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-radius: 4px;
      padding: 0.15rem 0.45rem;
      margin-right: auto;
    }

    .place-badge.meccan  { background: rgba(232,135,58,0.18);  color: #e8873a; }
    .place-badge.medinan { background: rgba(76,175,143,0.18); color: #4caf8f; }

    .verse-text {
      font-family: 'KFGQPC Hafs Uthmanic', serif;
      font-size: 1.35rem;
      line-height: 2.1;
      color: #f0f0f0;
      direction: rtl;
    }

    .verse-text mark {
      background: rgba(212,175,55,0.35);
      color: #ffe680;
      border-radius: 3px;
      padding: 0 2px;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #556;
      direction: ltr;
      display: none;
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 0.5rem; }

    .spinner {
      display: none;
      text-align: center;
      padding: 2rem;
      direction: ltr;
      color: #9ab;
    }

    .spinner::after {
      content: '';
      display: inline-block;
      width: 28px; height: 28px;
      border: 3px solid rgba(212,175,55,0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .filter-bar {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin-bottom: 1.5rem;
      direction: ltr;
    }

    .filter-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      color: #9ab;
      cursor: pointer;
    }

    .filter-label input[type="radio"] {
      accent-color: #d4af37;
      cursor: pointer;
    }

    .filter-label:has(input:checked) {
      color: #d4af37;
    }

    .trans-bar {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin-bottom: 1.5rem;
      direction: ltr;
      flex-wrap: wrap;
    }

    .trans-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: #9ab;
      cursor: pointer;
    }

    .trans-label input[type="checkbox"] { accent-color: #d4af37; cursor: pointer; }
    .trans-label:has(input:checked) { color: #d4af37; }

    .trans-en {
      margin-top: 0.55rem;
      padding-top: 0.45rem;
      border-top: 1px solid rgba(255,255,255,0.07);
      font-size: 0.92rem;
      color: #b0c8d8;
      direction: ltr;
      line-height: 1.7;
    }

    .trans-bn {
      margin-top: 0.4rem;
      padding-top: 0.35rem;
      border-top: 1px solid rgba(255,255,255,0.07);
      font-size: 0.92rem;
      color: #b8c8b0;
      direction: ltr;
      line-height: 1.7;
    }

    .error-msg {
      display: none;
      background: rgba(220,50,50,0.12);
      border: 1px solid rgba(220,50,50,0.3);
      border-radius: 8px;
      padding: 0.8rem 1.2rem;
      color: #f88;
      direction: ltr;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/" style="display:inline-block;margin-bottom:1rem;color:#9ab;font-size:0.85rem;text-decoration:none;direction:ltr;">&#8592; Back to Home</a>
      <h1>&#x202B;البحث في القرآن الكريم&#x202C;</h1>
      <p>Quran Word Search &mdash; Tanzil Simple Text</p>
    </header>

    <div class="search-box">
      <input id="searchInput" type="text" placeholder="أدخل كلمة للبحث..." autocomplete="off" />
      <button onclick="doSearch()">Search</button>
    </div>

    <div class="filter-bar">
      <label class="filter-label">
        <input type="radio" name="place" value="" checked onchange="doSearch()" /> All Surahs
      </label>
      <label class="filter-label">
        <input type="radio" name="place" value="Meccan" onchange="doSearch()" /> Meccan Only
      </label>
      <label class="filter-label">
        <input type="radio" name="place" value="Medinan" onchange="doSearch()" /> Medinan Only
      </label>
    </div>

    <div class="trans-bar">
      <label class="trans-label">
        <input type="checkbox" id="transEn" onchange="doSearch()" /> English &mdash; Mustafa Khattab (The Clear Quran)
      </label>
      <label class="trans-label">
        <input type="checkbox" id="transBn" onchange="doSearch()" /> বাংলা &mdash; আবু বকর যাকারিয়া
      </label>
    </div>

    <div class="stats" id="stats">
      Found <span id="statTotal">0</span> occurrence(s) of
      &ldquo;<span id="statWord"></span>&rdquo; across
      <span id="statVerses">0</span> verse(s)
      <span id="statScope"></span>
    </div>

    <div class="error-msg" id="errorMsg">Something went wrong. Please try again.</div>
    <div class="spinner" id="spinner">Searching&hellip;</div>
    <div class="empty-state" id="emptyState">
      <div class="icon">&#x1F50D;</div>
      <div>No verses found for this word.</div>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script>
    const input = document.getElementById('searchInput');
    input.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

    // Arabic diacritics (tashkeel) range — allowed between base letters
    const DIACRITICS = '[ؐ-ًؚ-ٰٟ]*';

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Build a regex that matches the bare word even when diacritics appear
    // between its letters in the display text.
    function buildDiacriticRegex(word) {
      return new RegExp(
        word.split('').map(escapeRegex).join(DIACRITICS) + DIACRITICS,
        'g'
      );
    }

    function highlight(text, word) {
      if (!word) return escapeHtml(text);
      const regex = buildDiacriticRegex(word);
      // Walk through the original text, escape HTML per segment, wrap matches
      let result = '';
      let last = 0;
      let m;
      while ((m = regex.exec(text)) !== null) {
        result += escapeHtml(text.slice(last, m.index));
        result += `<mark>${escapeHtml(m[0])}</mark>`;
        last = m.index + m[0].length;
      }
      result += escapeHtml(text.slice(last));
      return result;
    }

    async function doSearch() {
      const word = input.value.trim();
      if (!word) return;

      const place = document.querySelector('input[name="place"]:checked').value;
      const wantEn = document.getElementById('transEn').checked;
      const wantBn = document.getElementById('transBn').checked;

      document.getElementById('stats').style.display = 'none';
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('results').innerHTML = '';
      document.getElementById('spinner').style.display = 'block';

      try {
        const params = new URLSearchParams({ word });
        if (place) params.set('place', place);
        if (wantEn) params.append('trans', 'en');
        if (wantBn) params.append('trans', 'bn');
        const res = await fetch(`/quran/search?${params}`);
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();

        document.getElementById('spinner').style.display = 'none';

        if (data.total === 0) {
          document.getElementById('emptyState').style.display = 'block';
          return;
        }

        document.getElementById('statWord').textContent = data.word;
        document.getElementById('statTotal').textContent = data.total.toLocaleString();
        document.getElementById('statVerses').textContent = data.verse_count.toLocaleString();
        document.getElementById('statScope').textContent = place ? `— ${place} surahs only` : '';
        document.getElementById('stats').style.display = 'block';

        const container = document.getElementById('results');
        for (const v of data.results) {
          const placeClass = v.place ? v.place.toLowerCase() : '';
          const card = document.createElement('div');
          card.className = `verse-card ${placeClass}`;
          card.innerHTML = `
            <div class="verse-ref">
              <span class="ref-loc">Surah ${v.surah} : Ayah ${v.ayah}${v.count > 1 ? ` &nbsp;&bull;&nbsp; ${v.count}x` : ''}</span>
              <span class="surah-name">${v.surah_name}</span>
              <span class="surah-name-ar">${v.surah_name_arabic}</span>
              ${v.place ? `<span class="place-badge ${placeClass}">${v.place}</span>` : ''}
            </div>
            <div class="verse-text">${highlight(v.text, word)}</div>
            ${v.trans_en ? `<div class="trans-en">${escapeHtml(v.trans_en)}</div>` : ''}
            ${v.trans_bn ? `<div class="trans-bn">${escapeHtml(v.trans_bn)}</div>` : ''}
          `;
          container.appendChild(card);
        }
      } catch (err) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'block';
      }
    }
  </script>
</body>
</html>
